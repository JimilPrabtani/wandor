# Deploys the built SPA to the prod origin bucket via GitHub OIDC.
#
# No AWS keys are stored anywhere: the workflow assumes WandorSiteDeployRole
# (see waf-ops-platform/bootstrap/wandor-deploy-role.tf), which can only sync
# this bucket and invalidate the CloudFront cache. AI keys never appear here
# at all -- they live in AWS Secrets Manager and are read by the API Lambda.
#
# Repository VARIABLES (not secrets -- none of these are sensitive; the VITE_*
# values are baked into the public bundle by design):
#   AWS_DEPLOY_ROLE_ARN        arn of WandorSiteDeployRole
#   SITE_BUCKET                wafops-prod-origin-<account-id>
#   CLOUDFRONT_DISTRIBUTION_ID from `terraform -chdir=envs/prod output`
#   VITE_COGNITO_USER_POOL_ID / VITE_COGNITO_CLIENT_ID / VITE_COGNITO_DOMAIN
#   VITE_RUM_APP_MONITOR_ID / VITE_RUM_IDENTITY_POOL_ID /
#   VITE_RUM_GUEST_ROLE_ARN / VITE_RUM_REGION   (optional; RUM off if unset)

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

concurrency: deploy-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_RUM_APP_MONITOR_ID: ${{ vars.VITE_RUM_APP_MONITOR_ID }}
          VITE_RUM_IDENTITY_POOL_ID: ${{ vars.VITE_RUM_IDENTITY_POOL_ID }}
          VITE_RUM_GUEST_ROLE_ARN: ${{ vars.VITE_RUM_GUEST_ROLE_ARN }}
          VITE_RUM_REGION: ${{ vars.VITE_RUM_REGION }}
        run: |
          npm ci
          npm run build

      - name: Check deploy configuration
        id: deploy_config
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [[ -n "$AWS_DEPLOY_ROLE_ARN" && -n "$SITE_BUCKET" && -n "$CLOUDFRONT_DISTRIBUTION_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy because one or more required repo variables are missing (AWS_DEPLOY_ROLE_ARN, SITE_BUCKET, CLOUDFRONT_DISTRIBUTION_ID)."
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.deploy_config.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to origin bucket
        if: steps.deploy_config.outputs.enabled == 'true'
        run: aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}" --delete

      - name: Invalidate CloudFront
        if: steps.deploy_config.outputs.enabled == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
